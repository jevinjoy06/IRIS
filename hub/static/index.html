<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IRIS</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #272727;
    --text: #e8e8e8;
    --muted: #666;
    --accent: #7c6aff;
    --accent-dim: #3d3466;
    --user-bg: #1a1a2e;
    --error: #ff6b6b;
    --tool-bg: #1a1a1a;
    --tool-border: #333;
  }

  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'SF Mono', 'Consolas', monospace; font-size: 14px; }

  #app { display: flex; flex-direction: column; height: 100vh; max-width: 860px; margin: 0 auto; }

  header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  header .logo { color: var(--accent); font-size: 18px; font-weight: 700; letter-spacing: 0.12em; }
  header .status { font-size: 11px; color: var(--muted); }
  header .dot { width: 7px; height: 7px; border-radius: 50%; background: #444; flex-shrink: 0; transition: background 0.3s; }
  header .dot.connected { background: #4caf50; }
  header .dot.connecting { background: #ff9800; animation: pulse 1s infinite; }

  #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth; }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-track { background: transparent; }
  #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .msg { display: flex; gap: 12px; max-width: 100%; }
  .msg.user { flex-direction: row-reverse; }

  .msg-body { max-width: 78%; }
  .msg.user .msg-body { align-items: flex-end; display: flex; flex-direction: column; }

  .msg-label { font-size: 10px; color: var(--muted); letter-spacing: 0.08em; margin-bottom: 4px; text-transform: uppercase; }
  .msg.user .msg-label { text-align: right; }

  .bubble { padding: 10px 14px; border-radius: 12px; line-height: 1.6; white-space: pre-wrap; word-break: break-word; }
  .msg.user .bubble { background: var(--user-bg); border: 1px solid var(--accent-dim); }
  .msg.iris .bubble { background: var(--surface); border: 1px solid var(--border); }
  .msg.error .bubble { background: #1a0808; border: 1px solid #5a1a1a; color: var(--error); }

  .bubble.streaming::after {
    content: '\25ae';
    color: var(--accent);
    animation: blink 0.8s step-end infinite;
    margin-left: 2px;
  }

  .tool-pill {
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 11px; color: #aaa;
    background: var(--tool-bg); border: 1px solid var(--tool-border);
    border-radius: 6px; padding: 3px 8px; margin: 4px 0;
  }
  .tool-pill .icon { color: var(--accent); }

  #composer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; flex-shrink: 0; align-items: flex-end; }

  #input {
    flex: 1; background: var(--surface); border: 1px solid var(--border);
    border-radius: 10px; color: var(--text); font: inherit;
    padding: 10px 14px; resize: none; outline: none; max-height: 160px; min-height: 42px;
    line-height: 1.5; transition: border-color 0.2s;
  }
  #input:focus { border-color: var(--accent-dim); }
  #input::placeholder { color: var(--muted); }

  #send-btn {
    background: var(--accent); border: none; border-radius: 10px;
    color: #fff; cursor: pointer; font: inherit; font-size: 13px;
    padding: 10px 18px; flex-shrink: 0; align-self: flex-end;
    transition: opacity 0.2s; height: 42px;
  }
  #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #send-btn:not(:disabled):hover { opacity: 0.85; }

  @keyframes blink { 50% { opacity: 0; } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="dot" id="status-dot"></div>
    <div class="logo">IRIS</div>
    <div class="status" id="status-text">connecting…</div>
  </header>
  <div id="messages"></div>
  <div id="composer">
    <textarea id="input" placeholder="Talk to IRIS…" rows="1" autocomplete="off" spellcheck="false"></textarea>
    <button id="send-btn" disabled>Send</button>
  </div>
</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('send-btn');
const dot = document.getElementById('status-dot');
const statusText = document.getElementById('status-text');

let ws = null;
let currentBubble = null;
let reconnectTimeout = null;
let busy = false;

function setStatus(state) {
  dot.className = 'dot ' + state;
  const labels = { connected: 'connected', connecting: 'connecting…', disconnected: 'disconnected' };
  statusText.textContent = labels[state] || state;
  sendBtn.disabled = state !== 'connected' || busy;
}

function connect() {
  clearTimeout(reconnectTimeout);
  setStatus('connecting');
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host + '/ws');

  ws.onopen = () => { setStatus('connected'); };

  ws.onmessage = (evt) => {
    const msg = JSON.parse(evt.data);
    if (msg.type === 'token') {
      if (!currentBubble) currentBubble = appendMessage('iris');
      currentBubble.bubble.textContent += msg.text;
      currentBubble.bubble.classList.add('streaming');
      scrollBottom();
    } else if (msg.type === 'tool_use') {
      if (!currentBubble) currentBubble = appendMessage('iris');
      const pill = document.createElement('div');
      pill.className = 'tool-pill';
      const icon = document.createElement('span');
      icon.className = 'icon';
      icon.textContent = '⚙';
      const label = document.createTextNode(' ' + msg.tool + '…');
      pill.appendChild(icon);
      pill.appendChild(label);
      currentBubble.body.appendChild(pill);
      scrollBottom();
    } else if (msg.type === 'done') {
      if (currentBubble) currentBubble.bubble.classList.remove('streaming');
      currentBubble = null;
      busy = false;
      sendBtn.disabled = false;
    } else if (msg.type === 'error') {
      if (currentBubble) currentBubble.bubble.classList.remove('streaming');
      currentBubble = null;
      appendErrorMessage(msg.text || 'Unknown error');
      busy = false;
      sendBtn.disabled = false;
    }
  };

  ws.onclose = () => {
    setStatus('disconnected');
    currentBubble = null;
    busy = false;
    reconnectTimeout = setTimeout(connect, 2000);
  };

  ws.onerror = () => ws.close();
}

function appendMessage(role, text) {
  const msg = document.createElement('div');
  msg.className = 'msg ' + role;

  const body = document.createElement('div');
  body.className = 'msg-body';

  const lbl = document.createElement('div');
  lbl.className = 'msg-label';
  lbl.textContent = role === 'user' ? 'you' : 'iris';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  if (text) bubble.textContent = text;

  body.appendChild(lbl);
  body.appendChild(bubble);
  msg.appendChild(body);
  messagesEl.appendChild(msg);
  scrollBottom();
  return { msg, body, bubble };
}

function appendErrorMessage(text) {
  const msg = document.createElement('div');
  msg.className = 'msg error';
  const body = document.createElement('div');
  body.className = 'msg-body';
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = 'Error: ' + text;
  body.appendChild(bubble);
  msg.appendChild(body);
  messagesEl.appendChild(msg);
  scrollBottom();
}

function send() {
  const text = inputEl.value.trim();
  if (!text || busy || !ws || ws.readyState !== WebSocket.OPEN) return;
  appendMessage('user', text);
  ws.send(JSON.stringify({ type: 'message', text: text }));
  inputEl.value = '';
  inputEl.style.height = 'auto';
  busy = true;
  sendBtn.disabled = true;
  currentBubble = null;
  scrollBottom();
}

function scrollBottom() {
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 160) + 'px';
});

sendBtn.addEventListener('click', send);

connect();
</script>
</body>
</html>
